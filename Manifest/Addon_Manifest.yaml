Name: Dune Rev
Author: hugsyf
SourceUrl: https://github.com/hugsyf/dune-rev
ShortDescription: A dark, Fluent-inspired Desktop theme with adaptive layouts and expandable plugin cards.
Description: >-
    Dune Rev brings a low-glare Fluent-inspired design to Playnite Desktop, with
    responsive Details and Grid views, expandable plugin cards, and native Playnite
    Achievements integration. Card details expand above separate Overview, Reviews
    and News tabs. Optional extensions add activity statistics,
    HowLongToBeat estimates, system requirements, language support, DLC,
    screenshots, Steam reviews and news. ThemeModifier provides layout and
    display options.
Tags: ["Theme", "Fluent", "Dark", "Desktop"]
