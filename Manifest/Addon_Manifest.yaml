Name: Dune Rev
Author: hugsyf
SourceUrl: https://github.com/hugsyf/dune-rev
ShortDescription: A dark, Fluent-inspired Desktop theme with adaptive layouts and expandable plugin cards.
Description: >-
    Dune Rev brings a low-glare Fluent-inspired design to Playnite Desktop, with
    Details, Grid and Grid Details views, rounded platform/store cover banners,
    expandable plugin cards, and native Playnite Achievements integration.
    Optional extensions add completion estimates, session and performance charts,
    requirements, language support and DLC. Overview, related games, notes,
    store/personal screenshots, reviews and news have separate content tabs.
    ThemeModifier provides Hero, layout, visibility and appearance options.
Tags: ["Theme", "Fluent", "Dark", "Desktop"]
