    Changelog:
      - First Dune Rev release, based on Dune by sakasakiking.
      - Adds broad extension compatibility and adaptive extension summary cards.
      - Introduces the consistent low-glare Fluent Dim palette.
      - Improves Details View and Grid View layouts, filters, feature icons, and interaction feedback.
      - Uses independent wide and narrow layouts so information columns do not hide or compress summary cards.
      - Isolates Details and Grid hero-video players so playback remains available after switching views.
      - Adds consistently named bilingual ThemeModifier controls for pane, card, logo, button, and extension-panel sizing.
